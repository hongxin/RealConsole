# RealConsole 最小配置（v1.8.4+）
# 适用于新手快速上手
#
# 理念：Less Config, More Magic
# ✨ 只需配置 API key，其他全部智能默认

# LLM 配置（必需）
llm:
  primary:
    # 方式1: 使用环境变量（推荐）
    api_key: ${DEEPSEEK_API_KEY}

    # 方式2: 直接填写（不推荐，安全性低）
    # api_key: "your-api-key-here"

# 就这么简单！🎉
#
# 🚀 快速开始：
#   1. 设置环境变量: export DEEPSEEK_API_KEY="your-key"
#   2. 运行: realconsole
#   3. 开始使用
#
# 📚 智能默认值：
#   - LLM provider: 自动检测（deepseek/openai/claude）
#   - 工具调用: 启用
#   - 智能建议: 启用
#   - 离坎炼化炉: 启用（自主学习）
#   - 所有其他配置: 优化的默认值
#
# 💡 需要更多配置？
#   - 查看 config/standard.yaml（常用配置）
#   - 查看 realconsole.yaml（完整配置）
#   - 运行 realconsole wizard（配置向导）
#
# 📖 文档：
#   - 快速开始: QUICK_START.md
#   - 完整文档: docs/02-practice/user/user-guide.md
