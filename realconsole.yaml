# SimpleConsole 配置文件
# 使用环境变量: ${VAR} 或 ${VAR:-default}

# 命令前缀
prefix: "/"

# LLM 配置
llm:
  # Primary LLM（通常是远程 API，用于生产）
  primary:
    provider: deepseek
    model: deepseek-chat
    endpoint: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}

  # Fallback LLM（通常是本地 Ollama，快速响应）
  # fallback:
    # provider: ollama
    # model: qwen3:4b
    # endpoint: http://192.168.3.120:11434

  # LLM 交互日志（用于复盘、debug、性能分析）
  logging:
    enabled: true                    # 是否启用（默认 false）
    # log_dir: ~/.realconsole/llm_logs  # 日志目录（可选，默认 ~/.realconsole/llm_logs）
    include_content: true             # 是否记录完整内容（默认 true）
    retention_days: 30                # 日志保留天数（默认 30）
    max_size_mb: 100                  # 最大日志大小 MB（默认 100）

# 功能开关
features:
  shell_enabled: true
  shell_timeout: 10
  tool_calling_enabled: true

  # 工具调用迭代限制（可选）
  max_tool_iterations: 30      # 最多迭代轮数（默认 5）
  max_tools_per_round: 5       # 每轮最多工具数（默认 3）
  
# ✨ 新增：启用 Workflow Intent 系统
  workflow_enabled: true
  workflow_cache_enabled: true
  workflow_cache_ttl_default: 300  # 缓存 5 分钟

memory:
  capacity: 30
  persistent_file: "memory/session.jsonl"
  auto_save: true

# 显示模式配置 (v0.5.2+)
display:
  # 显示模式：minimal（极简）、standard（标准）、debug（调试）
  # minimal：只显示必要信息，无启动信息、无中间过程（默认）
  # standard：显示适中信息，有简化的启动和执行信息
  # debug：显示所有细节，包括配置路径、LLM 信息、完整命令等
  mode: minimal

  # 是否显示对话轮次详情（仅在 debug 模式下生效，默认 true）
  # 即使是正常成功的对话也会显示 LLM 多轮次来回的详细信息
  # 便于分析上下文使用情况和 workflow 套路重用
  show_conversation_rounds: true

# Intent DSL 智能增强配置 (v0.5.2+)
intent:
  # LLM 智能参数提取（默认 false - 保持高性能）
  # 当 Regex 提取失败时，使用 LLM 理解语义并提取参数
  llm_extraction_enabled: false

  # LLM 命令验证（默认 false - 保持高性能）
  # 在执行前使用 LLM 验证命令的合理性
  llm_validation_enabled: false

  # 命令验证置信度阈值（0.0-1.0，默认 0.7）
  # 低于此阈值会触发警告
  validation_threshold: 0.7

  # 验证失败时是否需要用户确认（默认 true）
  require_confirmation: true

  # ✨ Phase 7: LLM 驱动的 Pipeline 生成（默认 false - 实验性功能）
  # 让 LLM 理解用户意图，动态生成 Pipeline 执行计划
  llm_generation_enabled: true

  # LLM 生成失败时是否降级到规则匹配（默认 true）
  llm_generation_fallback: true

# 对话上下文：自动模式
conversation:
  mode: auto  # 智能识别需要上下文的场景
  # 保留最近 9 轮对话（适合短对话）
  max_turns: 9
  # 最大上下文长度 8K 字符（约 2K tokens）
  max_context_length: 64000
  # 自动清除策略
  auto_clear:
    enabled: true
    idle_timeout: 300      # 5 分钟空闲后清除
    on_task_complete: true # 任务完成后清除
  # 包含工具调用和错误信息
  include:
    tool_calls: true
    shell_output: false
    errors: true

# 语音播报配置 (v1.3.7+)
voice:
  enabled: true                    # 是否启用语音播报（默认 false）
  # voice: "Ting-Ting"             # 语音名称（可选，macOS 中文语音）
  max_queue_size: 10               # 播报队列最大长度（默认 10）
  auto_broadcast: true             # 自动播报 LLM 响应（默认 true）
  max_broadcast_length: 200        # 最大播报长度/字符（默认 200）
  filter_code_blocks: true         # 过滤代码块（默认 true）

# 离坎炼化炉配置 (v1.8.2+ Phase 4.3)
# 自主学习循环系统：从交互中提取模式，持续优化建议质量
likan:
  enabled: true                    # 是否启用炼化炉（默认 true）
  cycle_interval_secs: 300         # 循环间隔/秒（默认 300 = 5分钟）
  notification_mode: minimal       # 通知模式：minimal（简洁）/ prompt（提示符）/ none（静默）
  show_in_prompt: false            # 是否在提示符中显示状态（默认 false）

  # 模式提取阈值
  min_confidence: 0.6              # 最小置信度（0.0-1.0，默认 0.6）
  min_frequency: 3                 # 最小频率/次（默认 3）
  max_patterns: 50                 # 最大模式数量（默认 50）

# ============================================================================
# 配置说明
# ============================================================================
#
# 支持的 LLM Providers:
#
# 1. Ollama (本地)
#    provider: ollama
#    model: qwen3:4b (或 gemma3:27b, deepseek-r1:8b 等)
#    endpoint: http://localhost:11434
#
# 2. Deepseek (远程)
#    provider: deepseek
#    model: deepseek-chat
#    endpoint: https://api.deepseek.com/v1
#    api_key: sk-...
#
# 环境变量示例:
#   export DEEPSEEK_API_KEY="sk-your-api-key"
#
# 然后在配置中使用:
#   api_key: ${DEEPSEEK_API_KEY}
#
